packages:
  - "."

# unrs-resolver is an ESLint import-resolver helper (eslint-config-next).
# It is not used by next dev or next build.
# Native binaries already come from optionalDependencies
# (@unrs/resolver-binding-*). The postinstall is only a download fallback.
# Use a real boolean. The placeholder "set this to true or false" still errors.
allowBuilds:
  unrs-resolver: false

# Security floor for a transitive dev dependency (ESLint tooling) that
# `pnpm update` leaves on the vulnerable 5.0.9.
overrides:
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
