# unrs-resolver is pulled in by eslint-import-resolver-typescript
# (via eslint-config-next). It is not used by next dev or next build.
#
# Native code ships as optionalDependencies:
#   @unrs/resolver-binding-<platform>
# The postinstall (napi-postinstall) only downloads a binary if those
# optional packages were skipped (--no-optional). pnpm installs them by
# default, so the script is unnecessary and is explicitly denied.
allowBuilds:
  unrs-resolver: false
